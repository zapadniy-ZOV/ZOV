spring.application.name=ZOV

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://zov_mongo_user:zov_mongo_pass@localhost:27017/zov?authSource=admin

# Server Configuration
server.port=21341
server.address=0.0.0.0

# WebSocket configuration
spring.websocket.message-buffer-size=32768
spring.websocket.ping-timeout=20000

# Logging
logging.level.org.springframework.web=INFO
logging.level.itmo.rshd=DEBUG

# Security
allowed-origins=${ORIGINS}
